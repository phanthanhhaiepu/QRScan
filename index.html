<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Quét QR / Mã vạch</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{
      --green:#1e8e3e; --orange:#e8710a; --blue:#1a73e8; --bg:#f5f6f8; --card:#fff; --text:#1f2430;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
    }
    .tabs{ display:flex; background:var(--card); position:sticky; top:0; z-index:5; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .tab{
      flex:1; text-align:center; padding:14px 0; font-size:16px; font-weight:600;
      color:#888; border-bottom:3px solid transparent; cursor:pointer; user-select:none;
    }
    .tab.active.di{ color:var(--blue); border-color:var(--blue); }
    .tab.active.hoan{ color:var(--orange); border-color:var(--orange); }

    .toolbar{ padding:10px 14px; background:var(--card); border-bottom:1px solid #eee; }
    .toolbar label{ font-size:13px; color:#666; display:block; margin-bottom:4px; }
    select{
      width:100%; padding:10px; font-size:16px; border-radius:8px; border:1px solid #ddd; background:#fff;
    }

    #reader{ width:100%; background:#000; }
    #reader video{ width:100% !important; }

    .banner{
      margin:14px; padding:16px; border-radius:12px; background:var(--card);
      box-shadow:0 1px 4px rgba(0,0,0,.08); text-align:center; min-height:70px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    }
    .banner .code{ font-size:20px; font-weight:700; word-break:break-all; }
    .banner .status{ font-size:15px; font-weight:600; padding:3px 10px; border-radius:20px; display:inline-block; }
    .status.new{ background:#e6f4ea; color:var(--green); }
    .status.dup{ background:#fce8e6; color:#c5221f; }
    .banner .hint{ color:#999; font-size:13px; }

    .history{ margin:0 14px 20px; }
    .history h3{ font-size:14px; color:#666; margin:0 0 8px; }
    .history-item{
      display:flex; justify-content:space-between; align-items:center; background:var(--card);
      padding:10px 12px; border-radius:10px; margin-bottom:6px; font-size:14px; box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    .history-item .hcode{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; }
    .history-item .htime{ color:#999; font-size:12px; }
    .pill{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:20px; }
    .pill.new{ background:#e6f4ea; color:var(--green); }
    .pill.dup{ background:#fce8e6; color:#c5221f; }

    .overlay-msg{ text-align:center; padding:30px 16px; color:#c5221f; font-size:14px; }

    .switch-cam-btn{
      display:block; width:calc(100% - 28px); margin:10px 14px 0; padding:10px;
      border:1px solid #ddd; border-radius:8px; background:#fff; color:var(--blue);
      font-size:14px; font-weight:600;
    }
    .switch-cam-btn:active{ background:#f0f4ff; }

    .start-overlay{
      position:fixed; inset:0; background:linear-gradient(160deg,#111827 0%,#1c2536 100%); color:#fff; z-index:50;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      text-align:center; padding:24px;
    }
    .role-title{ font-size:20px; font-weight:700; letter-spacing:.3px; color:#e7e9f2; }
    .role-options{ display:flex; gap:16px; width:100%; max-width:360px; }
    .role-btn{
      flex:1; border:none; border-radius:18px; padding:28px 12px; display:flex; flex-direction:column;
      align-items:center; gap:10px; font-size:18px; font-weight:700; color:#fff; cursor:pointer;
      box-shadow:0 8px 20px rgba(0,0,0,.25); transition:transform .15s ease, box-shadow .15s ease;
    }
    .role-btn:active{ transform:scale(.96); box-shadow:0 4px 10px rgba(0,0,0,.3); }
    .role-btn .role-icon{ font-size:34px; }
    .role-di{ background:linear-gradient(135deg,#34a853,#1e8e3e); }
    .role-hoan{ background:linear-gradient(135deg,#f2994a,#e8710a); }
    .start-overlay p{ color:#c9ccd6; font-size:13px; max-width:280px; margin:4px 0 0; }
    .scan-flash{
      position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0;
      background:rgba(255,255,255,.72);
    }
    .scan-flash.active{ animation:scanFlash .18s ease-out; }
    @keyframes scanFlash{
      0%{ opacity:1; }
      100%{ opacity:0; }
    }
  </style>
</head>
<body>

  <div class="scan-flash" id="scanFlash" aria-hidden="true"></div>

  <div class="start-overlay" id="startOverlay">
    <div class="role-title">Bạn muốn quét..</div>
    <div class="role-options">
      <button id="roleDiBtn" class="role-btn role-di">
        <span class="role-icon">🚚</span>
        <span class="role-label">Đơn đi</span>
      </button>
      <button id="roleHoanBtn" class="role-btn role-hoan">
        <span class="role-icon">↩️</span>
        <span class="role-label">Đơn hoàn</span>
      </button>
    </div>
    <p>Hãy chọn để bắt đầu quét đơn!</p>
  </div>

  <div class="tabs">
    <div class="tab di active" id="tabDi">Đơn đi</div>
    <div class="tab hoan" id="tabHoan">Đơn hoàn</div>
  </div>

  <div class="toolbar">
    <label for="scannerSelect">Người quét</label>
    <select id="scannerSelect"><option>Đang tải danh sách...</option></select>
  </div>

  <div id="reader"></div>
  <div id="camError" class="overlay-msg" style="display:none;"></div>
  <button id="switchCamBtn" class="switch-cam-btn">Đổi camera (đang dùng: Camera sau)</button>

  <div class="banner" id="banner">
    <div class="hint">Đưa mã QR / mã vạch vào khung camera để quét tự động</div>
  </div>

  <div class="history">
    <h3>Lịch sử quét (phiên này)</h3>
    <div id="historyList"></div>
  </div>

  <script>
    // ĐIỀN URL WEB APP APPS SCRIPT CỦA BẠN VÀO ĐÂY (kết thúc bằng /exec, KHÔNG có /u/0/, /u/1/...)
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzy24awneFjqWnMgZmieT52DsKJe3E_11Tu4SABqi_ymCjwrHIWIjFguz-dlqaRtAq0/exec';

    var currentType = 'di';
    var lastResults = [];
    var scanning = { locked: false };
    var qr;

    function el(id){ return document.getElementById(id); }

    // Phát tiếng "bíp" bằng Web Audio API, không cần file âm thanh
    var audioCtx;
    // iOS Safari khoá Web Audio cho tới khi có 1 lần chạm màn hình bất kỳ —
    // mở khoá bằng nút "Chạm để bắt đầu" (bên dưới) để tiếng bíp phát được cho các lần quét sau
    function unlockAudio(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }catch(e){}
    }

    // status === 'Mới'  -> tiếng "ting" cao, gọn, dễ chịu
    // status === 'Trùng' -> tiếng "tẹt" trầm, rè, đi xuống (giống báo lỗi)
    function playResultSound(status){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (status === 'Mới'){
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1600, now);
          osc.frequency.exponentialRampToValueAtTime(2000, now + 0.08);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(130, now + 0.28);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        }
      }catch(e){ /* thiết bị không hỗ trợ, bỏ qua */ }
    }

    // Phản hồi cục bộ ngay khi thư viện nhận diện được mã, không chờ Apps Script.
    function playInstantScanFeedback(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var now = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1450, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      }catch(e){}

      var flash = el('scanFlash');
      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');
    }

    function setTab(type){
      currentType = type;
      el('tabDi').className = 'tab di' + (type === 'di' ? ' active' : '');
      el('tabHoan').className = 'tab hoan' + (type === 'hoan' ? ' active' : '');
    }
    el('tabDi').onclick = function(){ setTab('di'); };
    el('tabHoan').onclick = function(){ setTab('hoan'); };

    function loadNames(){
      fetch(GAS_URL + '?action=names')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var sel = el('scannerSelect');
          sel.innerHTML = '';
          var names = data.names || [];
          if (!names.length){
            sel.innerHTML = '<option value="">(Chưa có tên trong danh sách)</option>';
            return;
          }
          names.forEach(function(n){
            var opt = document.createElement('option');
            opt.value = n; opt.textContent = n;
            sel.appendChild(opt);
          });
          var saved = localStorage.getItem('scannerName');
          if (saved && names.indexOf(saved) !== -1) sel.value = saved;
        })
        .catch(function(err){
          el('scannerSelect').innerHTML = '<option value="">Lỗi tải danh sách: ' + err.message + '</option>';
        });
    }
    el('scannerSelect').addEventListener('change', function(){
      localStorage.setItem('scannerName', this.value);
    });

    loadNames();

    function renderBanner(status, code){
      var cls = status === 'Mới' ? 'new' : 'dup';
      el('banner').innerHTML =
        '<div class="code">' + escapeHtml(code) + '</div>' +
        '<div class="status ' + cls + '">' + (status === 'Mới' ? 'MỚI' : 'TRÙNG') + '</div>';
    }

    function renderHistory(){
      var html = lastResults.slice(0, 15).map(function(r){
        var cls = r.status === 'Mới' ? 'new' : 'dup';
        return '<div class="history-item">' +
          '<span class="hcode">' + escapeHtml(r.code) + '</span>' +
          '<span class="pill ' + cls + '">' + (r.status === 'Mới' ? 'Mới' : 'Trùng') + '</span>' +
          '<span class="htime">' + r.time + '</span>' +
        '</div>';
      }).join('');
      el('historyList').innerHTML = html;
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function onScanSuccess(decodedText){
      if (scanning.locked) return;
      var scanner = el('scannerSelect').value;
      if (!scanner){
        renderBannerError('Vui lòng chọn người quét trước khi quét mã');
        return;
      }
      scanning.locked = true;

      playInstantScanFeedback();
      if (navigator.vibrate) navigator.vibrate(80);

      // Gửi dạng text/plain để tránh CORS preflight (Apps Script không xử lý được preflight)
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: currentType, code: decodedText, scanner: scanner })
      })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (res.error) { renderBannerError('Lỗi: ' + res.error); return; }
          renderBanner(res.status, res.code);
          lastResults.unshift(res);
          renderHistory();
        })
        .catch(function(err){
          renderBannerError('Lỗi kết nối: ' + err.message);
        })
        .finally(function(){
          setTimeout(function(){ scanning.locked = false; }, 1500);
        });
    }

    function renderBannerError(msg){
      el('banner').innerHTML = '<div class="hint" style="color:#c5221f;">' + escapeHtml(msg) + '</div>';
    }

    var currentFacingMode = 'environment';

    // Chỉ bật các định dạng thực sự cần (QR + các mã vạch phổ biến) để giảm khối lượng
    // xử lý mỗi khung hình -> quét nhanh và nhạy hơn thay vì dò tất cả ~15 định dạng
    var FORMATS = [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E
    ];

    function startScanner(){
      qr = new Html5Qrcode('reader', {
        formatsToSupport: FORMATS,
        // Dùng BarcodeDetector gốc của trình duyệt khi hỗ trợ (nhanh + nhạy hơn nhiều so với
        // giải mã bằng JS thuần) — tự động fallback về cách cũ nếu trình duyệt không hỗ trợ
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      qr.start(
        { facingMode: currentFacingMode },
        {
                    fps: 15,
                    qrbox: { width: 280, height: 180 },
                    disableFlip: false,
                    videoConstraints: {
                                  facingMode: currentFacingMode,
                                  width: { ideal: 1920 },
                                  height: { ideal: 1080 }
                    }
        },
        onScanSuccess,
        function(){ /* lỗi từng frame, bỏ qua */ }
      ).catch(function(err){
        el('camError').style.display = 'block';
        el('camError').textContent = 'Không thể mở camera: ' + err + '. Hãy cấp quyền camera cho trình duyệt và tải lại trang.';
      });
    }

    function switchCamera(){
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      el('switchCamBtn').disabled = true;
      var restart = function(){
        el('camError').style.display = 'none';
        startScanner();
        el('switchCamBtn').textContent = 'Đổi camera (đang dùng: ' +
          (currentFacingMode === 'environment' ? 'Camera sau' : 'Camera trước') + ')';
        el('switchCamBtn').disabled = false;
      };
      if (qr){
        qr.stop().then(function(){ qr.clear(); restart(); }).catch(restart);
      } else {
        restart();
      }
    }
    el('switchCamBtn').onclick = switchCamera;

    // Chạm 1 lần duy nhất để mở khoá âm thanh + bắt đầu camera (yêu cầu bảo mật của Safari)
        function beginScan(type){
                setTab(type);
                unlockAudio();
                el('startOverlay').style.display = 'none';
                startScanner();
        }
        el('roleDiBtn').onclick = function(){ beginScan('di'); };
        el('roleHoanBtn').onclick = function(){ beginScan('hoan'); };
  </script>
</body>
</html>
